<style>
:root{
  --fs:1;
  --bg:#f4f5f7; --card:#ffffff; --text:#16181d; --sub:#5f6672; --line:#e3e6eb;
  --accent:#1f3a8a; --accent-soft:#e8edfb;
  --up:#d92d2d; --down:#1f9a45; --flat:#6b7280;
  --up-soft:#fde8e8; --down-soft:#e3f5ea;
  --ma5:#f08c00; --ma20:#ae3ec9; --ma60:#1c7ed6;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1014; --card:#181b21; --text:#eceef2; --sub:#9aa3b0; --line:#2a2f38;
    --accent:#7ea2ff; --accent-soft:#1d2741;
    --up:#ff5a5a; --down:#3ccf6e; --up-soft:#3a1a1c; --down-soft:#15301f;
    --shadow:none;
  }
  .btn:not(.ghost):not(.red):not(.green),.mic{color:#0b1020}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px * var(--fs))}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(env(safe-area-inset-top) + .6rem) 1rem .5rem;display:flex;align-items:center;gap:.5rem}
.top h1{font-size:1.35rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:999px;min-width:2.6rem;height:2.6rem;display:inline-flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;padding:0 .7rem}
main{padding:0 1rem calc(6rem + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:1rem;margin:0 0 .9rem}
.card h2{font-size:1.1rem;margin:0 0 .6rem;display:flex;align-items:center;gap:.4rem}
.card h2 .more{margin-left:auto;font-size:.9rem;font-weight:400}
.sub{color:var(--sub);font-size:.9rem}
.small{font-size:.82rem}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.bg-up{background:var(--up-soft);color:var(--up)} .bg-down{background:var(--down-soft);color:var(--down)} .bg-flat{background:var(--line);color:var(--sub)}
.row{display:flex;align-items:center;gap:.6rem}
.grow{flex:1;min-width:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--sub);padding:.45rem 0 .5rem;font-size:.78rem;line-height:1.2}
.tabs a b{display:block;font-size:1.35rem;font-weight:400;line-height:1.3}
.tabs a.on{color:var(--accent);font-weight:600}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:.45rem .3rem;cursor:pointer;color:var(--sub);font-size:.92rem;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.btn{border:0;border-radius:12px;padding:.75rem 1rem;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;font-size:1rem}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.red{background:var(--up);color:#fff}.btn.green{background:var(--down);color:#fff}
.btn.block{width:100%}
.btns{display:flex;gap:.6rem}.btns .btn{flex:1;white-space:nowrap;padding-left:.4rem;padding-right:.4rem}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr));gap:.6rem}
.pgrid a{background:var(--bg);border-radius:12px;padding:.7rem;text-decoration:none;color:inherit;display:block;min-width:0}
.list .item{display:flex;align-items:center;gap:.7rem;padding:.75rem 0;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit}
.list .item:last-child{border-bottom:0}
.item .nm{font-weight:600;word-break:break-word}
.item .px{flex-shrink:0}
.item .px .chip{margin-top:.2rem}
.item .cd{color:var(--sub);font-size:.85rem}
.item .px{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;border-radius:8px;padding:.15rem .5rem;font-size:.9rem;font-weight:600;font-variant-numeric:tabular-nums;min-width:4.6rem;text-align:center}
.tag{display:inline-block;font-size:.72rem;border-radius:6px;padding:0 .35rem;background:var(--accent-soft);color:var(--accent);margin-left:.3rem;vertical-align:middle;font-weight:500}
.idx{display:grid;grid-template-columns:repeat(auto-fill,minmax(8rem,1fr));gap:.6rem}
.idx>*{min-width:0}
.idx a{background:var(--bg);border-radius:12px;padding:.7rem;text-decoration:none;color:inherit;display:block}
.idx .v{font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums}
.search{display:flex;gap:.5rem;align-items:center;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:.35rem .35rem .35rem .9rem;margin-bottom:.9rem}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:1.1rem;padding:.5rem 0;min-width:0}
.mic{border:0;background:var(--accent);color:#fff;border-radius:10px;width:2.8rem;height:2.8rem;font-size:1.3rem;cursor:pointer}
.mic.on{background:var(--up);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.hero .price{font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.hero .chg{font-size:1.1rem;font-weight:600;font-variant-numeric:tabular-nums}
.chartwrap{position:relative}
canvas.chart{width:100%;height:18rem;display:block;touch-action:pan-y}
.chartinfo{font-size:.8rem;color:var(--sub);min-height:2.4em;font-variant-numeric:tabular-nums}
.legend{font-size:.78rem;color:var(--sub);display:flex;gap:.8rem;flex-wrap:wrap}
.legend i{display:inline-block;width:.8rem;height:3px;vertical-align:middle;margin-right:.25rem;border-radius:2px}
.pred{display:flex;align-items:center;gap:1rem}
.badge{border-radius:14px;padding:.6rem .9rem;font-size:1.35rem;font-weight:700;text-align:center;min-width:6.5rem}
.meter{height:.6rem;border-radius:99px;background:linear-gradient(90deg,var(--down),var(--line) 50%,var(--up));position:relative;margin:.9rem 0 .3rem}
.meter i{position:absolute;top:50%;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--card);border:3px solid var(--text);transform:translate(-50%,-50%)}
.meterlbl{display:flex;justify-content:space-between;font-size:.75rem;color:var(--sub)}
ul.plain{margin:.2rem 0 0;padding-left:1.2rem}
ul.plain li{margin:.35rem 0}
table.kv{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.kv td{padding:.45rem 0;border-bottom:1px solid var(--line);font-size:.95rem}
table.kv td:last-child{text-align:right;white-space:nowrap;padding-left:.6rem}
table.kv tr.sec td{color:var(--sub);font-size:.8rem;border-bottom:0;padding-top:.8rem}
.note{font-size:.8rem;color:var(--sub);background:var(--bg);border-radius:10px;padding:.6rem .75rem;margin-top:.6rem}
.empty{text-align:center;color:var(--sub);padding:1.5rem .5rem}
.spin{display:inline-block;width:1.2rem;height:1.2rem;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.skeleton{background:linear-gradient(90deg,var(--line),var(--bg),var(--line));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;height:1rem;margin:.4rem 0}
@keyframes sk{to{background-position:-200% 0}}
.err{background:var(--up-soft);color:var(--up);border-radius:12px;padding:.8rem;font-size:.95rem}
.field{margin:.7rem 0}
.field label{display:block;font-size:.88rem;color:var(--sub);margin-bottom:.25rem}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:.65rem .7rem;font-size:1rem;outline:0}
.field input:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem .8rem;font-variant-numeric:tabular-nums}
.sumgrid .big{grid-column:1/-1;font-size:1.7rem;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:1.1rem 1rem calc(1rem + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h3{margin:0 0 .5rem;font-size:1.2rem}
.toast{position:fixed;left:50%;bottom:calc(5.5rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:.6rem 1rem;border-radius:12px;z-index:60;font-size:.95rem;max-width:90vw;text-align:center}
.fsdemo{background:var(--bg);border-radius:10px;padding:.6rem .8rem;margin-top:.6rem}
.star.on{color:#f5a400}
.sugg{border:1px solid var(--line);border-radius:10px;margin-top:.3rem;max-height:12rem;overflow:auto}
.sugg div{padding:.55rem .7rem;border-bottom:1px solid var(--line);cursor:pointer}
.sugg div:last-child{border-bottom:0}
.hidden{display:none!important}
.newver{position:fixed;left:.8rem;right:.8rem;top:calc(env(safe-area-inset-top) + .5rem);z-index:70;background:var(--accent);color:#fff;border-radius:14px;padding:.8rem 1rem;display:flex;align-items:center;gap:.6rem;box-shadow:0 6px 20px rgba(0,0,0,.25);font-weight:600;cursor:pointer}
@media (prefers-color-scheme: dark){.newver{color:#0b1020}}
.cin{width:4.8rem;border:1px solid var(--line);border-radius:8px;padding:.3rem .45rem;background:var(--bg);color:var(--text);font-size:1rem;-webkit-appearance:none;appearance:none}
select.cin{width:4.2rem;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 7px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.disclaimer{font-size:.78rem;color:var(--sub);text-align:center;margin:1rem 0}
</style>

<body>
<div class="top"><h1 id="title">股票小幫手</h1><span id="topbtns"></span></div>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <a href="#home" data-t="home"><b>🏠</b>首頁</a>
  <a href="#search" data-t="search"><b>🔍</b>查股票</a>
  <a href="#screen" data-t="screen"><b>🎯</b>選股</a>
  <a href="#watch" data-t="watch"><b>⭐</b>自選股</a>
  <a href="#portfolio" data-t="portfolio"><b>💼</b>持股</a>
</nav>

<script>
'use strict';
/* ====================== 儲存 ====================== */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('sh_' + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('sh_' + k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem('sh_' + k); }catch(e){} }
};
const MOCK_INIT = { tw: 1000000, us: 30000 };
const defaultMock = () => ({ cash: { tw: MOCK_INIT.tw, us: MOCK_INIT.us }, pos: {}, hist: [] });
const S = {
  settings: Object.assign({ font: 2, token: '', disc: 1, view: 'plain', horizon: 'short', ctype: 'candle', range: 2 }, store.get('settings', {})),
  watch: store.get('watch', ['tw:2330', 'tw:0050', 'us:AAPL']),
  holdings: store.get('holdings', []),
  mock: store.get('mock', null) || defaultMock(),
};
const save = k => store.set(k, S[k]);
const FONT_STEPS = [0.9, 1, 1.15, 1.3, 1.5];
const applyFont = () => document.documentElement.style.setProperty('--fs', FONT_STEPS[S.settings.font] || 1);
applyFont();

/* ====================== 小工具 ====================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ymd = (daysAgo = 0) => { const d = new Date(Date.now() - daysAgo * 864e5); return d.toISOString().slice(0, 10); };
const today = () => ymd(0);
function num(v, d = 2, min = 0){ if (v == null || !isFinite(v)) return '—'; return Number(v).toLocaleString('zh-TW', { minimumFractionDigits: min, maximumFractionDigits: d }); }
const money = (v, mkt) => (v < 0 ? '-' : '') + (mkt === 'us' ? 'US$' : '$') + num(Math.abs(v), mkt === 'us' ? 2 : 0, mkt === 'us' ? 2 : 0);
const price = (v, mkt) => num(v, 2, mkt === 'us' ? 2 : 0);
const sign = v => (v > 0 ? '+' : '');
const pct = v => (v == null || !isFinite(v)) ? '—' : sign(v) + num(v, 2, 2) + '%';
const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
const arrow = v => v > 0 ? '▲' : v < 0 ? '▼' : '';
function toast(msg, ms = 2200){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
const parseKey = k => { const i = k.indexOf(':'); return { mkt: k.slice(0, i), id: k.slice(i + 1) }; };
const keyHash = k => '#s-' + k.replace(':', '-');
const isETF = id => /^00/.test(id);

/* ====================== 資料來源（FinMind） ====================== */
const API = 'https://api.finmindtrade.com/api/v4/data';
const mem = new Map();
function cacheGet(k, ttlMin){
  if (mem.has(k)){ const e = mem.get(k); if (Date.now() - e.t < ttlMin * 6e4) return e.d; }
  const e = store.get('c_' + k, null);
  if (e && Date.now() - e.t < ttlMin * 6e4){ mem.set(k, e); return e.d; }
  return null;
}
function cacheSet(k, d){
  const e = { t: Date.now(), d }; mem.set(k, e);
  if (!store.set('c_' + k, e)){ // 空間不夠：清掉最舊的快取再試一次
    try{
      const keys = Object.keys(localStorage).filter(x => x.startsWith('sh_c_'))
        .map(x => { let t = 0; try{ t = JSON.parse(localStorage.getItem(x)).t; }catch(_){} return [x, t]; })
        .sort((a, b) => a[1] - b[1]);
      keys.slice(0, Math.ceil(keys.length / 2)).forEach(([x]) => localStorage.removeItem(x));
      store.set('c_' + k, e);
    }catch(_){}
  }
}
class DataError extends Error{}
const inflight = new Map();
async function fm(dataset, params = {}, ttlMin = 30){
  const q = new URLSearchParams({ dataset, ...params });
  const ck = q.toString();
  const hit = cacheGet(ck, ttlMin); if (hit) return hit;
  if (inflight.has(ck)) return inflight.get(ck);
  const p = (async () => {
    const opt = {};
    if (S.settings.token) opt.headers = { Authorization: 'Bearer ' + S.settings.token };
    let r;
    try{ r = await fetch(API + '?' + q, opt); }
    catch(e){ throw new DataError('連不上股價資料來源，請確認網路連線。（每週日凌晨 0～7 點資料來源維護中）'); }
    if (r.status === 402) throw new DataError('查詢次數暫時用完了（免費版每小時約 300 次），請稍後再試，或到「設定」填入 FinMind 金鑰提高上限。');
    let j; try{ j = await r.json(); }catch(e){ throw new DataError('資料格式錯誤，請稍後再試。'); }
    if (j.status !== 200) throw new DataError('資料來源回應：' + (j.msg || '未知錯誤'));
    cacheSet(ck, j.data || []);
    return j.data || [];
  })();
  inflight.set(ck, p);
  try{ return await p; } finally{ inflight.delete(ck); }
}

/* 自家資料檔（每天由 GitHub 自動更新，放在 data/ 底下） */
const LOCAL = new Map();
async function local(path, ttlMin = 20){
  const e = LOCAL.get(path);
  if (e && Date.now() - e.t < (e.d === null ? 5 : ttlMin) * 6e4) return e.d;
  try{
    const r = await fetch('data/' + path, { cache: 'no-cache' });
    if (!r.ok) throw 0;
    const d = await r.json(); LOCAL.set(path, { t: Date.now(), d }); return d;
  }catch(_){ LOCAL.set(path, { t: Date.now(), d: null }); return null; }
}
const fileId = id => id.replace('^', '_');
const EXTRA = {};

const INDEX_NAMES = { 'tw:TAIEX': '台股加權指數', 'tw:TPEx': '櫃買指數', 'us:^DJI': '道瓊工業指數', 'us:^GSPC': '標普 500 指數', 'us:^IXIC': '那斯達克指數' };
const US_ZH = { AAPL:'蘋果',MSFT:'微軟',NVDA:'輝達',TSLA:'特斯拉',GOOGL:'Google(谷歌)',GOOG:'Google(谷歌)C股',AMZN:'亞馬遜',META:'Meta(臉書)',TSM:'台積電ADR',AMD:'超微',INTC:'英特爾',NFLX:'網飛',AVGO:'博通',QCOM:'高通',MU:'美光',ORCL:'甲骨文',BA:'波音',JNJ:'嬌生',PFE:'輝瑞',JPM:'摩根大通',WMT:'沃爾瑪',COST:'好市多',NKE:'耐吉',V:'Visa',MA:'萬事達卡',KO:'可口可樂',PEP:'百事',MCD:'麥當勞',SBUX:'星巴克',DIS:'迪士尼',PLTR:'Palantir',UNH:'聯合健康',XOM:'艾克森美孚',CVX:'雪佛龍',PG:'寶僑',IBM:'IBM',CSCO:'思科',ADBE:'Adobe',CRM:'Salesforce',UBER:'優步',BABA:'阿里巴巴',PDD:'拼多多',ASML:'艾司摩爾',ARM:'安謀',SMCI:'美超微',LLY:'禮來',NVO:'諾和諾德',BRK_B:'波克夏',SPY:'標普500 ETF',VOO:'標普500 ETF(Vanguard)',QQQ:'那斯達克100 ETF',DIA:'道瓊 ETF',VTI:'美國全市場 ETF',SOXX:'費城半導體 ETF',TLT:'20年美債 ETF',GLD:'黃金 ETF' };

async function twList(){
  const L = await local('list.json', 600); if (L && L.tw && L.tw.length) return L.tw;
  const raw = await fm('TaiwanStockInfo', {}, 60 * 24 * 7);
  const seen = new Map();
  for (const r of raw){ if (!seen.has(r.stock_id)) seen.set(r.stock_id, [r.stock_id, r.stock_name, r.industry_category || '', r.type || '']); }
  return [...seen.values()];
}
async function usList(){
  const L = await local('list.json', 600); if (L && L.us && L.us.length) return L.us;
  const raw = await fm('USStockInfo', {}, 60 * 24 * 7);
  const seen = new Map();
  for (const r of raw){ if (!seen.has(r.stock_id)) seen.set(r.stock_id, [r.stock_id, r.stock_name || '']); }
  return [...seen.values()];
}
let NAMES = store.get('names', {});
function rememberName(key, name){ if (name && NAMES[key] !== name){ NAMES[key] = name; store.set('names', NAMES); } }
async function nameOf(key){
  if (INDEX_NAMES[key]) return INDEX_NAMES[key];
  if (NAMES[key]) return NAMES[key];
  const { mkt, id } = parseKey(key);
  try{
    const list = mkt === 'tw' ? await twList() : await usList();
    const f = list.find(x => x[0] === id);
    let n = f ? f[1] : id;
    if (mkt === 'us' && US_ZH[id.replace('-', '_')]) n = US_ZH[id.replace('-', '_')];
    rememberName(key, n); return n;
  }catch(e){ return id; }
}
const nameSync = key => INDEX_NAMES[key] || NAMES[key] || parseKey(key).id;

// 取得日線：回傳 [{t,o,h,l,c,v}]，由舊到新
async function prices(key, ttl = 30){
  const { mkt, id } = parseKey(key);
  const start = ymd(365 * 3 + 20);
  let rows;
  const loc = await local(`p/${mkt}/${encodeURIComponent(fileId(id))}.json`, 30);
  if (loc && loc.r && loc.r.length){
    EXTRA[key] = loc;
    return loc.r.filter(a => a[4] > 0).map(a => ({ t: a[0], o: a[1] ?? a[4], h: a[2] ?? a[4], l: a[3] ?? a[4], c: a[4], v: a[5] || 0 }));
  }
  if (mkt === 'tw'){
    const raw = await fm('TaiwanStockPrice', { data_id: id, start_date: start }, ttl);

}

/* ====================== 圖表（自繪 canvas） ====================== */
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawChart(st){
  const cv = st.canvas; if (!cv || !cv.isConnected) return;
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);

  const fs = parseFloat(getComputedStyle(document.documentElement).fontSize) * 0.72;
  g.font = `${fs}px -apple-system,sans-serif`;
  const padR = Math.max(46, fs * 4.2), padL = 4, top = 8, priceB = H * 0.74, volT = priceB + fs * 1.9, volB = H - 2;
  const cw = (W - padL - padR) / n;
  const candle = st.type === 'candle';
  let hi = -Infinity, lo = Infinity;
  rows.forEach((r, i) => {
    hi = Math.max(hi, candle ? r.h : r.c); lo = Math.min(lo, candle ? r.l : r.c);
    for (const m of ['ma5', 'ma20', 'ma60']){ const v = st.ma[m][i]; if (v != null){ hi = Math.max(hi, v); lo = Math.min(lo, v); } }
  });
  if (hi === lo){ hi += 1; lo -= 1; }
  const pad = (hi - lo) * 0.06; hi += pad; lo -= pad;
  const y = v => top + (hi - v) / (hi - lo) * (priceB - top);
  const x = i => padL + cw * (i + 0.5);

  for (let k = 0; k <= 4; k++){
    const v = lo + (hi - lo) * k / 4, yy = y(v);
    g.beginPath(); g.moveTo(padL, yy); g.lineTo(W - padR, yy); g.stroke();
    g.fillText(num(v, v >= 1000 ? 0 : v >= 100 ? 1 : 2), W - padR + 4, yy);
  }
  // 日期刻度
  g.textBaseline = 'top'; g.textAlign = 'center';
  const ticks = 4;
  for (let k = 0; k < ticks; k++){
    const i = Math.round((n - 1) * (k + 0.5) / ticks); const t = rows[i].t;
    g.fillText(n > 260 ? t.slice(0, 7) : t.slice(5).replace('-', '/'), x(i), priceB + 3);
  }
  g.textAlign = 'left';
  // 價格
  if (candle){
    const bw = Math.max(1, cw * 0.68);
    rows.forEach((r, i) => {
      const col = r.c >= r.o ? UP : DN; g.strokeStyle = col; g.fillStyle = col;
      g.beginPath(); g.moveTo(x(i), y(r.h)); g.lineTo(x(i), y(r.l)); g.stroke();
      const y1 = y(Math.max(r.o, r.c)), y2 = y(Math.min(r.o, r.c));
      g.fillRect(x(i) - bw / 2, y1, bw, Math.max(1, y2 - y1));
    });
  } else {
    const col = rows[n - 1].c >= rows[0].c ? UP : DN;
    const grad = g.createLinearGradient(0, top, 0, priceB); grad.addColorStop(0, col + '55'); grad.addColorStop(1, col + '00');
    g.beginPath(); rows.forEach((r, i) => i ? g.lineTo(x(i), y(r.c)) : g.moveTo(x(i), y(r.c)));
    g.lineTo(x(n - 1), priceB); g.lineTo(x(0), priceB); g.closePath(); g.fillStyle = grad; g.fill();
    g.beginPath(); rows.forEach((r, i) => i ? g.lineTo(x(i), y(r.c)) : g.moveTo(x(i), y(r.c)));
    g.strokeStyle = col; g.lineWidth = 2; g.stroke(); g.lineWidth = 1;
  }
  // 均線
  if (st.showMA){
    for (const [m, cv2] of [['ma5', '--ma5'], ['ma20', '--ma20'], ['ma60', '--ma60']]){
      g.beginPath(); let s = false;
      st.ma[m].forEach((v, i) => { if (v == null) return; s ? g.lineTo(x(i), y(v)) : (g.moveTo(x(i), y(v)), s = true); });
      g.strokeStyle = cssv(cv2); g.lineWidth = 1.3; g.stroke();
    }
    g.lineWidth = 1;
  }
  // 成交量
  const vmax = Math.max(...rows.map(r => r.v)) || 1;
  rows.forEach((r, i) => {
    const prev = i ? rows[i - 1].c : r.o; g.fillStyle = (r.c >= prev ? UP : DN) + '99';
    const hh = (volB - volT) * r.v / vmax; g.fillRect(x(i) - Math.max(0.5, cw * 0.34), volB - hh, Math.max(1, cw * 0.68), hh);
  });
  g.fillStyle = SUB; g.textBaseline = 'top'; g.fillText('成交量', padL + 2, volT + 1);
  // 十字線
  if (st.hover != null){
    const i = st.hover, r = rows[i];
    g.strokeStyle = TXT; g.globalAlpha = 0.5; g.setLineDash([4, 4]);
    g.beginPath(); g.moveTo(x(i), top); g.lineTo(x(i), volB); g.moveTo(padL, y(r.c)); g.lineTo(W - padR, y(r.c)); g.stroke();
    g.setLineDash([]); g.globalAlpha = 1;
    g.fillStyle = TXT; g.beginPath(); g.arc(x(i), y(r.c), 3.5, 0, 7); g.fill();
  }

function bindChart(st, info, mkt){
  const show = i => {
    const r = st.rows[i], p = i ? st.rows[i - 1].c : r.o, d = r.c - p;
    info.innerHTML = `<b>${r.t}</b>　開 ${price(r.o, mkt)}　高 ${price(r.h, mkt)}　低 ${price(r.l, mkt)}　收 <b class="${cls(d)}">${price(r.c, mkt)}（${pct(p ? d / p * 100 : 0)}）</b>　量 ${volFmt(r.v, mkt)}`;
  };
  const pick = e => { const rc = st.canvas.getBoundingClientRect(); const padR = Math.max(46, parseFloat(getComputedStyle(document.documentElement).fontSize) * 0.72 * 4.2); const cw = (rc.width - 4 - padR) / st.rows.length; return Math.max(0, Math.min(st.rows.length - 1, Math.floor((e.clientX - rc.left - 4) / cw))); };

const volFmt = (v, mkt) => mkt === 'tw' ? num(v / 1000, 0) + ' 張' : (v >= 1e6 ? num(v / 1e6, 1) + 'M' : num(v, 0)) + ' 股';

  const pts = c.map((v, i) => `${(i / (c.length - 1) * w).toFixed(1)},${(h - (v - mn) / r * (h - 4) - 2).toFixed(1)}`).join(' ');

}

function errBox(e){ return `<div class="err">⚠️ ${esc(e instanceof DataError ? e.message : '發生錯誤：' + (e && e.message || e))}</div>`; }
function modal(html, onMount){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="sheet">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m) m.remove(); });
  document.body.appendChild(m);
  const close = () => m.remove();
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  onMount && onMount(m.querySelector('.sheet'), close);
  return close;
}
function confirmBox(msg, okText, fn, danger){
  modal(`<h3>${esc(msg)}</h3><div class="btns" style="margin-top:1rem"><button class="btn ghost" data-close>取消</button><button class="btn ${danger ? 'red' : ''}" id="ok">${esc(okText)}</button></div>`,
    (s, close) => s.querySelector('#ok').onclick = () => { close(); fn(); });
}

function route(){
  const h = (location.hash || '#home').slice(1);
  const tok = ++routeToken;
  window.scrollTo(0, 0);
  const tab = h.startsWith('s-') ? 'search' : h;
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.t === tab));
  if (h.startsWith('s-')){ const p = h.slice(2), i = p.indexOf('-'); return pageStock(decodeURIComponent(p.slice(0, i)) + ':' + decodeURIComponent(p.slice(i + 1)), tok); }
  ({ home: pageHome, search: pageSearch, screen: pageScreen, watch: pageWatch, portfolio: pagePortfolio, settings: pageSettings }[h] || pageHome)(tok);
}
window.addEventListener('hashchange', route);
const alive = tok => tok === routeToken;

async function renderQuoteList(el, keys, tok, editable){
  el.innerHTML = keys.map(k => `<a class="item" href="${keyHash(k)}" data-k="${esc(k)}">
    <div class="grow"><div class="nm">${esc(nameSync(k))}${parseKey(k).mkt === 'us' ? '<span class="tag">美股</span>' : ''}</div><div class="cd">${esc(parseKey(k).id)}</div></div>
    <div class="px"><div class="pv"><span class="spin"></span></div>${editable ? '' : '<span class="chip bg-flat pc">—</span>'}</div>
    ${editable ? `<button class="iconbtn" data-del="${esc(k)}" style="min-width:2.2rem;height:2.2rem;font-size:1rem">✕</button>` : ''}</a>`).join('');
  if (editable) el.querySelectorAll('[data-del]').forEach(b => b.onclick = e => { e.preventDefault(); const k = b.dataset.del; S.watch = S.watch.filter(x => x !== k); save('watch'); b.closest('.item').remove(); toast('已從自選股移除'); });
  // 名稱
  keys.forEach(k => { if (!NAMES[k] && !INDEX_NAMES[k]) nameOf(k).then(n => { const it = el.querySelector(`[data-k="${CSS.escape(k)}"] .nm`); if (it) it.firstChild.textContent = n; }); });
  // 報價（同時最多 3 筆）
  const queue = keys.slice();
  const worker = async () => {
    while (queue.length){
      const k = queue.shift(); const it = el.querySelector(`[data-k="${CSS.escape(k)}"]`);
      try{
        const q = await quote(k); if (!alive(tok) || !it) continue;
        it.querySelector('.pv').innerHTML = q ? `<b>${price(q.c, parseKey(k).mkt)}</b>` : '—';
        const pc = it.querySelector('.pc'); if (pc && q){ pc.className = 'chip pc ' + (q.chg > 0 ? 'bg-up' : q.chg < 0 ? 'bg-down' : 'bg-flat'); pc.textContent = pct(q.pct); }
        else if (q){ it.querySelector('.pv').innerHTML += `<div class="small ${cls(q.chg)}">${pct(q.pct)}</div>`; }
      }catch(e){ if (it) it.querySelector('.pv').innerHTML = '<span class="sub small">無資料</span>'; }
    }
  };
  await Promise.all([worker(), worker(), worker()]);
}
let RANK = null;
async function loadRank(tok){
  const el = $('#rank');
  try{
    if (!RANK){
      const scr = await local('screen-tw.json', 30);
      const c = cacheGet('twse_all', 30);
      if (scr && scr.rows && scr.rows.length){
        const ci = Object.fromEntries(scr.cols.map((k, n) => [k, n]));
        RANK = scr.rows.filter(r => /^\d{4}$|^00/.test(r[ci.id])).map(r => ({ id: r[ci.id], n: r[ci.n], c: r[ci.c], p: r[ci.chg] || 0, v: (r[ci.vt] || 0) * 1000 }));
      }
      else if (c) RANK = c;
      else {
        const r = await fetch('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL');
        const j = await r.json();
        RANK = j.map(x => { const c = parseFloat(x.ClosingPrice), ch = parseFloat(x.Change); return { id: x.Code, n: x.Name, c, ch, p: c && isFinite(ch) && c - ch ? ch / (c - ch) * 100 : 0, v: parseFloat(x.TradeVolume) || 0 }; })
          .filter(x => x.c > 0 && /^\d{4,6}$/.test(x.id));
        cacheSet('twse_all', RANK);
      }
    }
    if (!alive(tok)) return;
    const show = k => {
      const arr = RANK.slice().sort((a, b) => k === 'up' ? b.p - a.p : k === 'down' ? a.p - b.p : b.v - a.v).slice(0, 10);
      el.innerHTML = arr.map((x, i) => `<a class="item" href="#s-tw-${x.id}"><b class="sub" style="width:1.4rem">${i + 1}</b><div class="grow"><div class="nm">${esc(x.n)}</div><div class="cd">${x.id}${k === 'vol' ? '　' + num(x.v / 1000, 0) + ' 張' : ''}</div></div><div class="px"><b>${price(x.c, 'tw')}</b><br><span class="chip ${x.p > 0 ? 'bg-up' : x.p < 0 ? 'bg-down' : 'bg-flat'}">${pct(x.p)}</span></div></a>`).join('');
      RANK.forEach(x => { if (!NAMES['tw:' + x.id]) NAMES['tw:' + x.id] = x.n; });
    };
    show('up');
    $('#rkseg').onclick = e => { const b = e.target.closest('button'); if (!b) return; $('#rkseg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); show(b.dataset.k); };
  }catch(e){ if (alive(tok)) el.innerHTML = `<div class="empty small">排行榜暫時無法取得（證交所資料連線失敗），其他功能不受影響。</div>`; }
}

/* ====================== 查股票 ====================== */
function zhDigits(s){
  const m = { '零': '0', '〇': '0', '洞': '0', '一': '1', '么': '1', '幺': '1', '二': '2', '兩': '2', '三': '3', '四': '4', '五': '5', '六': '6', '七': '7', '八': '8', '九': '9' };
  return s.replace(/[零〇洞一么幺二兩三四五六七八九]/g, c => m[c]);
}
function normQ(s){
  s = (s || '').trim().replace(/[，。．,.!！?？\s]/g, '');
  s = s.replace(/^(查詢|查一下|查|搜尋|我要看|看一下|看)/, '').replace(/(的股票|股票|股價|這支|這檔)$/, '');
  if (/^[零〇洞一么幺二兩三四五六七八九\d]+$/.test(s)) s = zhDigits(s);
  return s.toUpperCase().replace(/^([A-Z]+)\.US$/, '$1');
}
async function searchStocks(q){
  q = normQ(q); if (!q) return [];
  const out = [];
  const [tw, us] = await Promise.allSettled([twList(), usList()]);
  const T = tw.status === 'fulfilled' ? tw.value : [], U = us.status === 'fulfilled' ? us.value : [];
  if (!T.length && !U.length && tw.reason) throw tw.reason;
  const latin = /^[A-Z.\-^]+$/.test(q);
  const twHits = T.filter(x => x[0].startsWith(q) || x[1].toUpperCase().includes(q))
    .sort((a, b) => (b[0] === q) - (a[0] === q) || (b[1] === q) - (a[1] === q) || a[0].length - b[0].length || (a[0] < b[0] ? -1 : 1)).slice(0, 25)
    .map(x => ({ key: 'tw:' + x[0], id: x[0], n: x[1], ind: x[2] }));
  const zhUS = Object.entries(US_ZH).filter(([, n]) => n.toUpperCase().includes(q)).map(([id]) => id.replace('_', '-'));
  const usHits = U.filter(x => x[0] === q || x[0].startsWith(q) || (q.length >= 3 && x[1].toUpperCase().includes(q)) || zhUS.includes(x[0]))
    .sort((a, b) => (b[0] === q) - (a[0] === q) || zhUS.includes(b[0]) - zhUS.includes(a[0]) || a[0].length - b[0].length).slice(0, 25)
    .map(x => ({ key: 'us:' + x[0], id: x[0], n: US_ZH[x[0].replace('-', '_')] ? `${US_ZH[x[0].replace('-', '_')]}（${x[1]}）` : x[1], ind: '' }));
  if (latin) out.push(...usHits, ...twHits); else out.push(...twHits, ...usHits);
  // 清單載不到時，仍允許直接用代號查
  if (!out.length){ if (/^\d{4,6}[A-Z]?$/.test(q)) out.push({ key: 'tw:' + q, id: q, n: '直接查詢台股 ' + q }); else if (/^[A-Z.\-^]{1,6}$/.test(q)) out.push({ key: 'us:' + q, id: q, n: '直接查詢美股 ' + q }); }
  return out.slice(0, 40);
}
function micSupported(){ return 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window; }
function startVoice(btn, onText){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ toast('這支手機的瀏覽器不支援語音輸入。可以點輸入框，再按鍵盤上的 🎤 麥克風來說。', 4500); return; }
  const r = new SR(); r.lang = 'zh-TW'; r.interimResults = false; r.maxAlternatives = 1;
  btn.classList.add('on'); toast('請說出股票代號或名稱…');
  r.onresult = e => onText(e.results[0][0].transcript);
  r.onerror = e => toast(e.error === 'not-allowed' ? '請允許使用麥克風，或改用鍵盤上的 🎤 說話' : '沒聽清楚，請再試一次');
  r.onend = () => btn.classList.remove('on');
  try{ r.start(); }catch(e){ btn.classList.remove('on'); toast('語音輸入啟動失敗，請改用鍵盤上的 🎤'); }
}

  $('#star').onclick = () => {
    if (watched()){ S.watch = S.watch.filter(x => x !== key); toast('已從自選股移除'); }

  const rec = store.get('recent', []).filter(x => x !== key); rec.unshift(key); store.set('recent', rec.slice(0, 10));
  const I = indicators(rows), i = I.n - 1, last = rows[i], prev = rows[i - 1] || last;
  const chg = last.c - prev.c, chgP = prev.c ? chg / prev.c * 100 : 0;

/* ---------- 回測 ---------- */
function metricsAt(I, i, mkt, unit = 1){
  const c = I.c, n = i + 1;
  if (i < 1) return null;
  const chg = (c[i] / c[i - 1] - 1) * 100;
  let st = 0; for (let k = i; k > 0; k--){ const d = Math.sign(c[k] - c[k - 1]); if (!d) break; if (!st) st = d; else if (d !== Math.sign(st)) break; else st += d; }
  let gx = null, kx = null;
  for (let j = 0; j < 6; j++){
    const a = i - j, b = i - j - 1; if (b < 0) break;
    if (gx == null && I.ma20[b] != null && I.ma5[a] > I.ma20[a] && I.ma5[b] <= I.ma20[b]) gx = j;
    if (kx == null && I.K[b] != null && I.K[a] > I.D[a] && I.K[b] <= I.D[b] && I.K[b] < 30) kx = j;
  }
  let mx20 = -Infinity, mx60 = -Infinity, sv = 0, cnt = 0;
  for (let k = Math.max(0, i - 59); k <= i; k++){ mx60 = Math.max(mx60, c[k]); if (k > i - 20){ mx20 = Math.max(mx20, c[k]); sv += I.v[k]; cnt++; } }
  return { c: c[i], chg, st, vr: I.vma5[i] ? I.v[i] / I.vma5[i] : null, av: sv / cnt / unit,
    a20: I.ma20[i] == null ? null : +(c[i] > I.ma20[i]), a60: I.ma60[i] == null ? null : +(c[i] > I.ma60[i]), gx, kx, rsi: I.rsi[i],
    nh20: +(n >= 20 && c[i] >= mx20), nh60: +(n >= 60 && c[i] >= mx60), dd60: (1 - c[i] / mx60) * 100, lu: +(mkt === 'tw' && chg >= 9.5) };
}
async function backtestSheet(mkt, conds){
  const act = Object.entries(conds).filter(([k]) => CMAP[k] && condOK(CMAP[k], mkt));
  const btc = act.filter(([k]) => CMAP[k].bt), skip = act.filter(([k]) => !CMAP[k].bt);
  modal(`<h3>🧪 回測：這組條件過去準不準？</h3><div id="btb"><span class="spin"></span> 下載歷史資料並計算中…（約 1～3 MB，第一次比較久）</div><button class="btn ghost block" data-close style="margin-top:1rem">關閉</button>`, async s => {
    const box = s.querySelector('#btb');
    if (!btc.length){ box.innerHTML = `<div class="note">這組條件都是籌碼或基本面，沒有歷史資料可以回測。</div>`; return; }
    const H = await local(`hist-${mkt}.json`, 600);
    if (!H){ box.innerHTML = `<div class="note">回測資料還沒準備好（App 放上網路、每天自動更新後才會有）。</div>`; return; }
    await new Promise(r => setTimeout(r, 30));
    const t0 = performance.now();
    const acc = { 5: [], 20: [] }, base = { 5: [0, 0, 0], 20: [0, 0, 0] }; let hits = 0; const sample = [];
    for (let s2 = 0; s2 < H.ids.length; s2++){
      const rows = [];
      for (let d = 0; d < H.d.length; d++){ const c = H.c[s2][d]; if (c == null) continue; rows.push({ t: H.d[d], c, h: c * (1 + (H.h[s2][d] || 0) / 1e4), l: c * (1 - (H.l[s2][d] || 0) / 1e4), o: c, v: H.v[s2][d] || 0 }); }
      if (rows.length < 80) continue;
      const I = indicators(rows);
      for (let i = 60; i < rows.length - 5; i++){
        const f5 = (I.c[i + 5] / I.c[i] - 1) * 100, f20 = i + 20 < rows.length ? (I.c[i + 20] / I.c[i] - 1) * 100 : null;
        base[5][0] += f5; base[5][1] += f5 > 0; base[5][2]++;
        if (f20 != null){ base[20][0] += f20; base[20][1] += f20 > 0; base[20][2]++; }
        const m = metricsAt(I, i, mkt, 1);
        if (!btc.every(([k, v]) => { try{ return !!CMAP[k].test(m, +v); }catch(e){ return false; } })) continue;
        hits++; acc[5].push(f5); if (f20 != null) acc[20].push(f20);
        if (sample.length < 400) sample.push([H.ids[s2], rows[i].t, f5]);
      }
    }
    const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null, win = a => a.length ? a.filter(x => x > 0).length / a.length * 100 : null;
    const line = h => { const a = acc[h], bA = base[h][0] / base[h][2], bW = base[h][1] / base[h][2] * 100; if (!a.length) return ''; const A = avg(a), W = win(a);
      return `<tr><td>買進後 ${h} 天</td><td><b class="${cls(A)}">${pct(A)}</b><br><span class="sub small">${num(W, 0)}% 機會上漲</span></td><td class="sub">${pct(bA)}<br><span class="small">${num(bW, 0)}% 上漲</span></td></tr>`; };
    const A5 = avg(acc[5]), W5 = win(acc[5]), bA5 = base[5][0] / base[5][2], bW5 = base[5][1] / base[5][2] * 100;
    let v = '';
    if (hits < 30) v = `只有 ${hits} 次符合，次數太少，結果參考價值很低。`;
    else if (A5 - bA5 > 0.4 && W5 - bW5 > 2) v = '👍 過去符合這組條件的股票，之後表現<b>比平均好</b>。';
    else if (bA5 - A5 > 0.4 && bW5 - W5 > 2) v = '👎 過去符合這組條件的股票，之後表現<b>比平均差</b>，要小心。';
    else v = '➖ 過去表現<b>跟平均差不多</b>，這組條件沒有明顯優勢。';
    const universe = mkt === 'tw' ? `台股成交最活絡的 ${H.ids.length} 支` : `美股 ${H.ids.length} 支大型股`;
    box.innerHTML = `<div class="sub small">用 ${H.d[60] || H.d[0]} ～ ${H.d[H.d.length - 6]} 的資料，在${universe}裡找出每一天符合條件的股票，看之後漲跌如何。</div>
      <div style="font-size:1.15rem;margin:.7rem 0"><b>符合條件 ${hits} 次</b></div>
      ${hits ? `<table class="kv"><tr class="sec"><td></td><td>符合條件的股票</td><td>所有股票平均</td></tr>${line(5)}${line(20)}</table>` : ''}
      <div class="note" style="background:var(--accent-soft);color:var(--text)">${v}</div>
      ${skip.length ? `<div class="note">以下條件沒有歷史資料，回測時略過：${skip.map(([k, v2]) => esc(condText(k, v2, mkt))).join('、')}</div>` : ''}
      <div class="note">⚠️ 過去的表現不代表未來，也沒有算進手續費和交易稅。<span class="small">（計算 ${num((performance.now() - t0) / 1000, 1)} 秒）</span></div>`;
  });
}

/* ====================== 個股頁：籌碼、基本資料、新聞 ====================== */
const yi = v => v == null ? '—' : Math.abs(v) >= 1e8 ? num(v / 1e8, 1) + ' 億' : Math.abs(v) >= 1e4 ? num(v / 1e4, 0) + ' 萬' : num(v, 0);

  const fs = strk(1), ts = strk(2), sum = idx => ch.reduce((a, r) => a + r[idx], 0);

function fundCard(key, plain, ind, lastPx){
  const { mkt } = parseKey(key), ex = EXTRA[key]; if (!ex) return '';
  const f = ex.f || {}, dv = (ex.dv || []).slice(-6).reverse();
  const items = [];
  const add = (k, v, hint) => { if (v != null && v !== '' && v !== '—') items.push(`<tr><td>${k}${plain && hint ? `<div class="sub small">${hint}</div>` : ''}</td><td>${v}</td></tr>`); };
  if (ind) add('產業', esc(ind));
  add('本益比', f.pe ? num(f.pe, 1) + ' 倍' : null, '股價是一年賺的錢的幾倍，越低代表越便宜');
  add('殖利率', f.y ? num(f.y, 2) + '%' : null, '用現在價格買進，一年領到的股利大約是幾 %');
  add('股價淨值比', f.pb ? num(f.pb, 2) + ' 倍' : null, '股價是公司每股淨資產的幾倍，低於 1 代表比帳面價值便宜');
  add(f.epsq === '近四季' ? '近四季 EPS' : '最近一季 EPS', f.eps != null ? `<span class="${cls(f.eps)}">${num(f.eps, 2)} 元</span>${f.epsq ? `<div class="sub small">${esc(f.epsq)}</div>` : ''}` : null, '每一股賺多少錢，負數代表虧損');
  add('最新月營收', f.rev ? `${yi(f.rev * (f.rev < 1e7 ? 1000 : 1))} 元${f.yoy != null ? `<div class="small ${cls(f.yoy)}">比去年同月 ${pct(f.yoy)}</div>` : ''}` : null, f.revm ? `${esc(f.revm)} 的營收` : '');
  add('董事長', f.chair ? esc(f.chair) : null);
  add('成立日期', f.est);
  add(ex.mk === 'tpex' ? '上櫃日期' : '上市日期', f.lst);
  add('資本額', f.cap ? yi(f.cap) + ' 元' : null);
  if (dv.length){
    const cur = mkt === 'us' ? 'US$' : '';
    add('近年配息', dv.map(([y, v]) => `${y} 年 ${cur}${num(v, 3)}`).join('<br>'), '每年每股配發的現金股利合計');
    if (lastPx && dv[0] && mkt === 'us') add('近一年殖利率（估）', num(dv[0][1] / lastPx * 100, 2) + '%');

/* ====================== 手續費 ====================== */
const FEE = 0.001425;
function twFee(amount, disc){ return amount > 0 ? Math.max(20, Math.floor(amount * FEE * (disc ?? S.settings.disc))) : 0; }
function twTax(amount, id){ return Math.floor(amount * (isETF(id) ? 0.001 : 0.003)); }
function buyCost(mkt, id, px, sh){ const a = px * sh; return mkt === 'tw' ? { amount: a, fee: twFee(a), tax: 0, total: a + twFee(a) } : { amount: a, fee: 0, tax: 0, total: a }; }
function sellNet(mkt, id, px, sh){ const a = px * sh; if (mkt !== 'tw') return { amount: a, fee: 0, tax: 0, total: a }; const f = twFee(a), t = twTax(a, id); return { amount: a, fee: f, tax: t, total: a - f - t }; }

function aggregate(lots){
  const m = new Map();
  for (const l of lots){ const a = m.get(l.key) || { key: l.key, sh: 0, cost: 0, lots: [] }; a.sh += l.sh; a.cost += l.px * l.sh + (l.fee || 0); a.lots.push(l); m.set(l.key, a); }
  return [...m.values()];
}

    <div class="field"><label>單位</label><select id="mu">${mkt === 'tw' ? '<option value="1000">張（1000 股）</option><option value="1">股（零股）</option>' : '<option value="1">股</option>'}</select></div></div>
    <div class="note" id="msum"></div>
    <div class="btns" style="margin-top:1rem"><button class="btn ghost" data-close>取消</button><button class="btn red" id="mok">確定買進</button></div>`, (s, close) => {
    let side = 'buy'; const g = x => s.querySelector('#' + x);
    const calc = () => {
      const sh = (+g('mq').value) * (+g('mu').value), cash = M.cash[mkt];
      if (side === 'buy'){ const c = buyCost(mkt, id, px, sh); g('msum').innerHTML = `金額 ${money(c.amount, mkt)} ＋ 手續費 ${money(c.fee, mkt)} ＝ <b>${money(c.total, mkt)}</b><br>可用現金 ${money(cash, mkt)}${c.total > cash ? '　<b class="up">現金不夠</b>' : ''}`; }
      else { const c = sellNet(mkt, id, px, sh); g('msum').innerHTML = `金額 ${money(c.amount, mkt)} － 手續費 ${money(c.fee, mkt)}${mkt === 'tw' ? ` － 證交稅 ${money(c.tax, mkt)}` : ''} ＝ <b>${money(c.total, mkt)}</b><br>目前持有 ${num(pos ? pos.sh : 0, 4)} 股${pos && sh > pos.sh ? '　<b class="up">股數不夠</b>' : ''}`; }
    };
    g('bs').onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return; side = b.dataset.k; g('bs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); g('mok').className = 'btn ' + (side === 'buy' ? 'red' : 'green'); g('mok').textContent = side === 'buy' ? '確定買進' : '確定賣出'; calc(); };
    g('mq').oninput = g('mu').onchange = calc; calc();
    g('mok').onclick = () => {
      const sh = (+g('mq').value) * (+g('mu').value); if (!(sh > 0)) return toast('請輸入數量');
      if (side === 'buy'){
        const c = buyCost(mkt, id, px, sh); if (c.total > M.cash[mkt]) return toast('模擬現金不夠');
        M.cash[mkt] -= c.total; const p = M.pos[key] || { sh: 0, cost: 0 }; p.sh += sh; p.cost += c.total; M.pos[key] = p;
        M.hist.unshift({ t: today(), key, side, px, sh, total: c.total });
      } else {
        const p = M.pos[key]; if (!p || sh > p.sh + 1e-9) return toast('持有股數不夠');
        const c = sellNet(mkt, id, px, sh), basis = p.cost * sh / p.sh;
        M.cash[mkt] += c.total; p.cost -= basis; p.sh -= sh; if (p.sh < 1e-9) delete M.pos[key];
        M.hist.unshift({ t: today(), key, side, px, sh, total: c.total, pl: c.total - basis });
      }
      M.hist = M.hist.slice(0, 200); save('mock'); close();
      toast(side === 'buy' ? '模擬買進成功 🎉' : '模擬賣出成功'); store.set('ptab', 'mock');
      if (location.hash === '#portfolio') route();
    };
  });
}

      <div class="btns" style="margin-top:.8rem"><button class="btn ghost" id="exp">匯出備份</button><label class="btn ghost" style="text-align:center">匯入備份<input type="file" id="imp" accept=".json,application/json" hidden></label></div></div>
    <div class="card"><h2>🔑 FinMind 金鑰（選填）</h2>
      <div class="sub small">不填也能用。免費版每小時約可查 300 次；到 <a href="https://finmindtrade.com/" target="_blank" rel="noopener">finmindtrade.com</a> 免費註冊後，把金鑰貼在這裡可以提高上限。</div>
      <div class="field"><input id="tk" type="password" placeholder="貼上金鑰（token）" value="${esc(st.token)}" autocomplete="off"></div>
      <div class="btns"><button class="btn ghost" id="tksave">儲存金鑰</button><button class="btn ghost" id="cc">清除暫存資料</button></div></div>
    <div class="card"><h2>ℹ️ 關於</h2><div class="sub small">
      股票小幫手（版本 ${APP_VERSION.startsWith('__') ? '開發中' : APP_VERSION}）<br>資料來源：Yahoo Finance（股價）、臺灣證券交易所與櫃買中心 OpenAPI（法人買賣、本益比、營收、除權息）、FinMind（新聞與備援）。台股每個交易日 17:20、美股每天清晨 05:40 自動更新，非即時報價。<br><br>
      <b>免責聲明：</b>本 App 的分析與預測是根據歷史價格以統計方法計算，不保證未來走勢，也不構成任何投資建議。投資有風險，請自行判斷。</div></div>`;
  $('#fs').onclick = e => { const b = e.target.closest('button'); if (!b) return; st.font = +b.dataset.k; save('settings'); applyFont(); $('#fs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
  $('#disc').onchange = e => { st.disc = +e.target.value; save('settings'); toast('已更新手續費折扣'); };
  $('#tksave').onclick = () => { st.token = $('#tk').value.trim(); save('settings'); toast(st.token ? '已儲存金鑰' : '已移除金鑰'); };
  $('#cc').onclick = () => { try{ Object.keys(localStorage).filter(x => x.startsWith('sh_c_')).forEach(x => localStorage.removeItem(x)); }catch(e){} mem.clear(); RANK = null; toast('已清除暫存的股價資料'); };
  $('#exp').onclick = () => {
    const data = JSON.stringify({ app: 'stock-helper', v: 1, at: new Date().toISOString(), watch: S.watch, holdings: S.holdings, mock: S.mock, settings: { ...S.settings, token: '' }, names: NAMES }, null, 1);
    try{
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = `股票小幫手備份-${today()}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast('備份檔已下載，請存到雲端或傳給自己');
    }catch(e){ navigator.clipboard.writeText(data).then(() => toast('已複製備份內容')); }
  };
  $('#imp').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try{
      const d = JSON.parse(await f.text()); if (d.app !== 'stock-helper') throw 0;
      confirmBox('匯入會取代目前手機上的自選股、持股和模擬帳戶，確定嗎？', '匯入', () => {
        S.watch = d.watch || []; S.holdings = d.holdings || []; S.mock = d.mock || defaultMock(); Object.assign(S.settings, d.settings || {}, { token: S.settings.token });
        NAMES = Object.assign(NAMES, d.names || {}); ['watch', 'holdings', 'mock', 'settings'].forEach(save); store.set('names', NAMES); applyFont(); toast('匯入完成 ✅'); pageSettings();
      });
    }catch(_){ toast('這不是股票小幫手的備份檔'); }
  };
}

/* ====================== 新版本提示 ====================== */
const APP_VERSION = '__APP_VERSION__';
let verShown = false, verLast = 0;
async function checkVersion(){
  if (verShown || APP_VERSION.startsWith('__') || Date.now() - verLast < 60e3) return;
  verLast = Date.now();
  try{
    const r = await fetch('version.json', { cache: 'no-store' }); if (!r.ok) return;
    const { v } = await r.json();
    if (v && v !== APP_VERSION){
      verShown = true;
      const b = document.createElement('div'); b.className = 'newver';
      b.innerHTML = '<span style="font-size:1.3rem">✨</span><span style="flex:1">App 有新版本，點這裡更新</span><span>›</span>';
      b.onclick = () => location.reload();
      document.body.appendChild(b);
    }
  }catch(e){}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkVersion(); });
setInterval(checkVersion, 30 * 6e4);
setTimeout(checkVersion, 3000);

/* ====================== 啟動 ====================== */
route();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
