<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>股票學堂</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="股票學堂">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --fs:1;
  --bg:#f4f5f7; --card:#fff; --text:#16181d; --sub:#5f6672; --line:#e3e6eb;
  --accent:#0f766e; --accent-soft:#dcf3ef; --accent-text:#fff;
  --up:#d92d2d; --down:#1f9a45; --flat:#6b7280; --up-soft:#fde8e8; --down-soft:#e3f5ea;
  --gold:#e8a200; --gold-soft:#fff4d6;
  --ma5:#f08c00; --ma20:#ae3ec9; --ma60:#1c7ed6;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1014; --card:#181b21; --text:#eceef2; --sub:#9aa3b0; --line:#2a2f38;
    --accent:#3fd0bd; --accent-soft:#143430; --accent-text:#05201c;
    --up:#ff5a5a; --down:#3ccf6e; --up-soft:#3a1a1c; --down-soft:#15301f;
    --gold:#ffc53d; --gold-soft:#3a2f12; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(17px * var(--fs))}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  line-height:1.65;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(env(safe-area-inset-top) + .6rem) 1rem .5rem;display:flex;align-items:center;gap:.5rem}
.top h1{font-size:1.3rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:999px;min-width:2.6rem;height:2.6rem;display:inline-flex;align-items:center;justify-content:center;font-size:1.15rem;cursor:pointer;padding:0 .7rem;text-decoration:none;color:var(--text)}
main{padding:0 1rem calc(6rem + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:1rem;margin:0 0 .9rem}
.card h2{font-size:1.08rem;margin:0 0 .6rem;display:flex;align-items:center;gap:.4rem}
.card h2 .more{margin-left:auto;font-size:.88rem;font-weight:400}
.sub{color:var(--sub);font-size:.9rem}
.small{font-size:.82rem}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.row{display:flex;align-items:center;gap:.6rem}
.grow{flex:1;min-width:0}
.hidden{display:none!important}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--sub);padding:.45rem 0 .5rem;font-size:.78rem;line-height:1.2}
.tabs a b{display:block;font-size:1.35rem;font-weight:400;line-height:1.3}
.tabs a.on{color:var(--accent);font-weight:600}
.btn{border:0;border-radius:14px;padding:.8rem 1rem;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-text);font-size:1rem;text-align:center;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.red{background:var(--up);color:#fff}.btn.green{background:var(--down);color:#fff}
.btn.gray{background:var(--line);color:var(--text)}
.btn.block{width:100%;display:block}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:.6rem}.btns .btn{flex:1;white-space:nowrap;padding-left:.4rem;padding-right:.4rem}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:.45rem .3rem;cursor:pointer;color:var(--sub);font-size:.92rem;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.2rem;scrollbar-width:none}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.3rem .8rem;white-space:nowrap;cursor:pointer;font-size:.9rem}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.field{display:flex;align-items:center;gap:.5rem;margin:.45rem 0}
.field label{flex:0 0 auto;min-width:5.5em;color:var(--sub);font-size:.92rem}
.field input,.field select,textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:.55rem .7rem;font-size:1rem}
textarea{width:100%;min-height:4.5rem;resize:vertical}
input[type=range]{flex:1;accent-color:var(--accent);padding:0;border:0;background:none}
.search{display:flex;align-items:center;gap:.5rem;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:.2rem .8rem;margin-bottom:.9rem}
.search input{flex:1;border:0;background:transparent;padding:.6rem 0;font-size:1rem;outline:none;min-width:0}
.list .item{display:flex;align-items:center;gap:.7rem;padding:.7rem 0;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit}
.list .item:last-child{border-bottom:0}
.tip{background:var(--accent-soft);border-radius:12px;padding:.7rem .85rem;margin:.7rem 0}
.warn{background:var(--gold-soft);border-radius:12px;padding:.7rem .85rem;margin:.7rem 0}
.disclaimer{color:var(--sub);font-size:.78rem;text-align:center;margin:1.2rem .5rem}
.num{font-variant-numeric:tabular-nums}

/* 首頁 */
.hero{display:flex;gap:.8rem;align-items:center}
.flame{font-size:2.4rem;line-height:1}
.week{display:flex;justify-content:space-between;margin-top:.8rem}
.week div{text-align:center;font-size:.75rem;color:var(--sub);flex:1}
.week i{display:block;width:1.9rem;height:1.9rem;border-radius:50%;margin:.2rem auto 0;background:var(--line);font-style:normal;line-height:1.9rem;font-size:.95rem}
.week i.ok{background:var(--gold);color:#fff}
.week i.today{outline:2px solid var(--gold);outline-offset:1px}
.bar{height:.55rem;background:var(--line);border-radius:999px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.next{display:block;text-decoration:none;color:inherit;background:linear-gradient(135deg,var(--accent),#14b8a6);color:#fff;border-radius:18px;padding:1.1rem;margin-bottom:.9rem;box-shadow:var(--shadow)}
.next .k{font-size:.85rem;opacity:.9}.next .t{font-size:1.3rem;font-weight:800;margin:.15rem 0 .5rem}
.next .go{display:inline-block;background:#fff;color:#0f766e;border-radius:999px;padding:.4rem 1rem;font-weight:700}
.unit h2 .ic{font-size:1.4rem}
.les{display:flex;align-items:center;gap:.7rem;padding:.6rem 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.les:last-child{border-bottom:0}
.les .dot{flex:0 0 2.1rem;height:2.1rem;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--sub);font-weight:700}
.les.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.les.cur .dot{border-color:var(--accent);color:var(--accent)}
.les .stars{font-size:.8rem;color:var(--gold);white-space:nowrap}

/* 上課 */
.lesson{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.lhead{display:flex;align-items:center;gap:.6rem;padding:calc(env(safe-area-inset-top) + .6rem) 1rem .6rem}
.lhead .bar{flex:1}
.lbody{flex:1;overflow-y:auto;padding:0 1rem 1rem;-webkit-overflow-scrolling:touch}
.lbody .card{padding:1.15rem;max-width:720px;margin:0 auto .9rem}
.lbody h3{font-size:1.25rem;margin:0 0 .6rem}
.lbody p{margin:.5rem 0}
.lbody ul,.lbody ol{padding-left:1.3rem;margin:.5rem 0}.lbody li{margin:.3rem 0}
.lbody table{width:100%;border-collapse:collapse;margin:.6rem 0;font-size:.92rem}
.lbody td,.lbody th{border-bottom:1px solid var(--line);padding:.45rem .3rem;text-align:left;vertical-align:top}
.lfoot{padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom));display:flex;gap:.6rem;max-width:720px;width:100%;margin:0 auto}
.lfoot .btn{flex:1}
.term{color:var(--accent);font-weight:600;border-bottom:1.5px dashed var(--accent);cursor:pointer}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:.85rem 1rem;margin:.55rem 0;cursor:pointer;font-size:1rem}
.opt.right{border-color:var(--down);background:var(--down-soft)}
.opt.wrong{border-color:var(--up);background:var(--up-soft)}
.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:.8rem 1rem;margin-top:.6rem}
.fb.right{background:var(--down-soft)}.fb.wrong{background:var(--up-soft)}
.big{font-size:3.2rem;text-align:center;margin:.4rem 0}
.center{text-align:center}

/* 小字典 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:20px 20px 0 0;padding:1.1rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom));max-height:75vh;overflow-y:auto;max-width:720px;margin:0 auto;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
.sheet h3{margin:0 0 .3rem;font-size:1.25rem}
.tag{display:inline-block;font-size:.75rem;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:.05rem .45rem;font-weight:600;vertical-align:middle}
.toast{position:fixed;left:50%;bottom:calc(5.5rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:.6rem 1rem;border-radius:12px;z-index:50;font-size:.92rem;max-width:90vw}

/* 圖表、小工具 */
.w{background:var(--bg);border-radius:14px;padding:.8rem;margin:.7rem 0}
.w .sub{font-size:.85rem}
svg.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.kv div{background:var(--card);border-radius:10px;padding:.5rem .65rem}
.kv b{display:block;font-size:1.05rem}
.kv span{font-size:.78rem;color:var(--sub);display:block;line-height:1.35}
.res{background:var(--card);border-radius:12px;padding:.7rem .8rem;margin-top:.6rem}
.res b.big2{font-size:1.4rem}
.legend{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.78rem;color:var(--sub);margin-top:.3rem}
.legend i{display:inline-block;width:.9rem;height:.2rem;border-radius:2px;vertical-align:middle;margin-right:.25rem}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{padding:.4rem .25rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.scrollx{overflow-x:auto}
.check{display:flex;gap:.6rem;padding:.65rem 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check .ic{font-size:1.3rem;flex:0 0 1.6rem;text-align:center}
.skeleton{height:3rem;border-radius:10px;background:linear-gradient(90deg,var(--line),var(--bg),var(--line));background-size:200% 100%;animation:sk 1.2s infinite;margin:.4rem 0}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="top"><h1 id="title">股票學堂</h1><span id="topr"></span></div>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <a href="#home" data-t="home"><b>📚</b>學習</a>
  <a href="#practice" data-t="practice"><b>🎯</b>練習</a>
  <a href="#sim" data-t="sim"><b>🕰️</b>模擬</a>
  <a href="#dict" data-t="dict"><b>📖</b>字典</a>
</nav>
<script src="lessons.js"></script>
<script src="glossary.js"></script>
<script src="app.js"></script>
<script src="widgets.js"></script>
<script src="practice.js"></script>
<script>route();</script>
</body>
</html>
